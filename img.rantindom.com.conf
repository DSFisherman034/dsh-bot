server {
    server_name img.rantindom.com;
    root /opt/dsh-bot/images;

    location / {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=604800";
    }

    listen 8443 ssl;
    ssl_certificate /etc/letsencrypt/live/img.rantindom.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/img.rantindom.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

server {
    listen 80;
    server_name img.rantindom.com;
    return 404;
}
